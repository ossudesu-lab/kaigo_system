# 施設ごとの設定ファイル
#
# このシステムは他施設でも使えるように、施設ごとに異なる部分を
# コードではなくこのファイルに書く方針にしている（README「設計方針1」）。
# 施設を変えるときは、原則このファイルだけを書き換えれば動く。

[facility]
name = "ショートステイ"
# 定員。稼働率の計算に使う（②自動集計）
capacity = 30


# 部屋（ベッド）の一覧。棟ごとに、その棟のベッド番号を並べる。
#
# 表記ルール:
#   "1-1" のようにハイフンがあるもの … 準個室（二人部屋）のベッド1つ分
#   "6"   のように数字だけのもの     … 個室
#
# ここに並べた順が、そのままグリッドの行の並び順になる。
# 実際の部屋番号は棟の記号と連結した "A1-1" "B6" のような形になる。
[rooms]
A = [
  "1-1", "1-2",
  "2-1", "2-2",
  "3-1", "3-2",
  "5",
  "6",
  "7-1", "7-2",
  "8-1", "8-2",
  "9",
  "10",
  "11",
]
B = [
  "1-1", "1-2",
  "2-1", "2-2",
  "3",
  "5",
  "6-1", "6-2",
  "7-1", "7-2",
  "8",
  "9",
  "10-1", "10-2",
  "11",
]


# 入浴の設定
[bathing]
# 入浴種別の選択肢。施設によって種類も呼び方も違うため、ここで変更できるようにする。
# 並べた順が、そのまま入力画面のプルダウンの順になる。
types = ["一般", "リフト"]

# 何泊ごとに1回入浴するか。入浴回数 = 宿泊日数 ÷ この数（切り上げ）。
#   1〜3泊 → 1回 ／ 4〜6泊 → 2回 ／ 7〜9泊 → 3回
interval_nights = 3

# 日帰り利用（0泊）の人を入浴表に載せるか。
#
# 上の計算をそのまま当てると 0÷3 = 0回になって入浴表に出てこない。
# 日帰りでも入浴する運用なら true にする（1回として扱う）。
#
# 既定を true にしているのは、入浴表に余分な人が載っていてもスタッフが
# 飛ばせるのに対し、載っていない人は気づかれないため。
include_daytrip = true


# 問い合わせの設定
[inquiry]
# 問い合わせ内容の種類。施設によって呼び方や区分が違うので設定で変えられるようにする。
# 並べた順が、そのまま入力画面のプルダウンの順になる。
kinds = ["空き確認", "新規相談", "変更", "キャンセル", "その他"]

# 対応状況。左から順に進んでいく想定で並べる。
# 先頭を「未対応」にしておくと、新規登録の初期値がそこになる。
statuses = ["未対応", "対応中", "対応済み"]


# 帳票の設定
[reports]
# 当日台帳を横に何ブロック並べるか（5列セットの繰り返し数）。
# 紙面に収めるための都合なので、人数や用紙に合わせて変える。
# 1 にすると縦に1列だけになり、画面で見るときは読みやすい。
ledger_blocks = 2


# 集計の設定
[aggregation]
# 仮予約を人数・稼働率の集計に含めるか。
#
# 仮予約は最終的に成立しないことが多いため、既定では集計から外している。
# 含めてしまうと、稼働率が実績より高く出てしまう。
#
# 集計から外しても仮予約が見えなくなるわけではなく、
# レポートの「仮予約」列と予約表の点線表示にはそのまま残る。
include_tentative = false


# 警告の設定
#
# 現場の運用は施設によって違うので、「何を警告とみなすか」も切り替えられるようにする。
# システムは止めず、警告として気づかせるだけにとどめる（README「設計方針3」）。
[warnings]
# 準個室（二人部屋）に男女が同時に泊まっているとき、警告を出すか。
#
# 準個室に男女が入ってよいかは施設の方針によって運用が分かれるため、
# 設定で切り替えられるようにしている。
# 男女同室を認めていない施設は true にすると、該当するマスに印が付き、
# 画面の上に一覧が出る。true にしても登録自体はブロックしない。
mixed_gender_in_shared_room = false


# グリッド表示の設定
[grid]
# セルの色分け（①画面の見た目・色分けルール）
# 入所日・退所日は最優先で塗る。それ以外の宿泊中の日は「泊り（滞在中）」の色で
# 一律に塗る。以前は宿泊中の日を性別で塗り分けていたが、月次グラフの「青＝泊り」
# と意味が衝突するため、帯の色は状態（泊り/入所/退所）を表す用途に統一した。
# 性別は帯の色ではなく、氏名の横に付く「男／女」バッジ（色＋文字）で示す。
#
# 泊り／入所／退所の3色は CUD（カラーユニバーサルデザイン）推奨配色
# （Okabe-Ito パレット）を採用。P型・D型・T型のいずれの色覚特性でも
# 相互に見分けられる組み合わせなので、月次グラフとも同じ値で統一している。
color_stay = "#0072B2"       # 泊り・滞在中（青）
color_checkin = "#009E73"    # 入所日（緑）
color_checkout = "#D55E00"   # 退所日（朱）
color_male = "#64b5f6"       # 男性バッジ（青系）
color_female = "#f48fb1"     # 女性バッジ（ピンク系）
color_conflict = "#d32f2f"   # 重複の警告枠（赤）
color_mixed_gender = "#7b1fa2"  # 準個室の男女同室マーク（紫）
# 日帰り（0泊）。入所日の緑と紛らわしかったため、はっきり違う茶系にする（UI改善⑨）。
color_daytrip = "#6d4c41"    # 日帰り（茶系）
